name: Notify IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Check public endpoint responses
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://feiguotian.github.io/minitogo-public-facts/"
            "https://feiguotian.github.io/minitogo-public-facts/robots.txt"
            "https://feiguotian.github.io/minitogo-public-facts/sitemap.xml"
            "https://feiguotian.github.io/minitogo-public-facts/sitemap.txt"
            "https://feiguotian.github.io/minitogo-public-facts/facts.json"
            "https://feiguotian.github.io/minitogo-public-facts/llms.txt"
            "https://feiguotian.github.io/minitogo-public-facts/ai-one-sentence-web-game-guide.html"
            "https://feiguotian.github.io/minitogo-public-facts/ai-game-platform-facts.html"
            "https://feiguotian.github.io/minitogo-public-facts/iron-front-tactics-case.html"
          )
          for url in "${urls[@]}"; do
            ready=false
            for attempt in $(seq 1 24); do
              response="$(curl --silent --show-error --location --dump-header - --output /dev/null --write-out "%{http_code}" "$url" || true)"
              status="$(printf '%s' "$response" | tail -n 1)"
              content_type="$(printf '%s\n' "$response" | awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { value=$0; sub(/^[^:]*:[[:space:]]*/, "", value); ctype=value } END { print ctype }')"
              echo "Public URL: $url | Attempt: $attempt/24 | HTTP: ${status:-unknown} | Content-Type: ${content_type:-unknown}"
              if test "$status" = "200"; then
                ready=true
                break
              fi
              sleep 5
            done
            if test "$ready" != "true"; then
              echo "Public URL did not become available: $url" >&2
              exit 1
            fi
          done

      - name: Notify public facts URLs
        shell: bash
        run: |
          set -euo pipefail
          payload='{"host":"feiguotian.github.io","key":"minitogo-pages-20260811-aeo","keyLocation":"https://feiguotian.github.io/minitogo-public-facts/minitogo-pages-20260811-aeo.txt","urlList":["https://feiguotian.github.io/minitogo-public-facts/","https://feiguotian.github.io/minitogo-public-facts/facts.json","https://feiguotian.github.io/minitogo-public-facts/llms.txt","https://feiguotian.github.io/minitogo-public-facts/ai-one-sentence-web-game-guide.html","https://feiguotian.github.io/minitogo-public-facts/ai-game-platform-facts.html","https://feiguotian.github.io/minitogo-public-facts/iron-front-tactics-case.html"]}'
          status="$(curl --silent --show-error --output indexnow-response.txt --write-out "%{http_code}" --request POST --header "Content-Type: application/json; charset=utf-8" --data "$payload" https://api.indexnow.org/indexnow)"
          echo "IndexNow HTTP status: $status"
          cat indexnow-response.txt
          case "$status" in
            2*) ;;
            *) echo "IndexNow request failed" >&2; exit 1 ;;
          esac
