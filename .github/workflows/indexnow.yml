name: Notify IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Notify public facts URLs
        shell: bash
        run: |
          set -euo pipefail
          payload='{"host":"feiguotian.github.io","key":"minitogo-pages-20260811-aeo","keyLocation":"https://feiguotian.github.io/minitogo-public-facts/minitogo-pages-20260811-aeo.txt","urlList":["https://feiguotian.github.io/minitogo-public-facts/","https://feiguotian.github.io/minitogo-public-facts/facts.json","https://feiguotian.github.io/minitogo-public-facts/llms.txt"]}'
          status="$(curl --silent --show-error --output indexnow-response.txt --write-out "%{http_code}" --request POST --header "Content-Type: application/json; charset=utf-8" --data "$payload" https://api.indexnow.org/indexnow)"
          echo "IndexNow HTTP status: $status"
          cat indexnow-response.txt
          case "$status" in
            2*) ;;
            *) echo "IndexNow request failed" >&2; exit 1 ;;
          esac
